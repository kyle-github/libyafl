name: ppc64le-musl-linux

on: [push, pull_request]

jobs:
  setup-ppc64le-musl-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake make

  build-ppc64le-musl-linux:
    runs-on: ubuntu-latest
    needs: setup-ppc64le-musl-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake make
      - name: Download musl.cc cross-compiler
        run: |
          mkdir -p /opt/cross
          cd /opt/cross
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3: Downloading powerpc64le-linux-musl-cross.tgz..."
            if wget -O powerpc64le-linux-musl-cross.tgz https://musl.cc/powerpc64le-linux-musl-cross.tgz; then
              tar xzf powerpc64le-linux-musl-cross.tgz
              rm powerpc64le-linux-musl-cross.tgz
              echo "Download successful"
              exit 0
            else
              echo "Download attempt $attempt failed"
              if [ $attempt -lt 3 ]; then
                echo "Waiting 15 seconds before retry..."
                sleep 15
              fi
            fi
          done
          echo "All 3 download attempts failed"
          exit 1
      - name: Configure and Build
        run: |
          mkdir -p build && cd build
          cmake -DTARGET=powerpc64le-unknown-linux-gnu \
                -DCMAKE_C_COMPILER=/opt/cross/powerpc64le-linux-musl-cross/bin/powerpc64le-linux-musl-gcc \
                -DCMAKE_C_FLAGS='-static' \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=ppc64le \
                ..
          cmake --build .
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-ppc64le-musl-linux
          path: build/

  test-ppc64le-musl-linux:
    runs-on: ubuntu-latest
    needs: build-ppc64le-musl-linux
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ppc64le
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-ppc64le-musl-linux
          path: build/
      - name: Restore execute permissions
        run: chmod +x build/bin/*
      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure
