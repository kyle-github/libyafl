name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu AMD64
          - runner: ubuntu-latest
            os: Ubuntu
            arch: AMD64
            cmake-generator: Unix Makefiles

          # Ubuntu ARM64
          - runner: ubuntu-24.04-arm64
            os: Ubuntu
            arch: ARM64
            cmake-generator: Unix Makefiles

          # macOS AMD64 (Intel)
          - runner: macos-15-intel
            os: macOS
            arch: AMD64
            cmake-generator: Unix Makefiles

          # macOS ARM64 (Apple Silicon)
          - runner: macos-15
            os: macOS
            arch: ARM64
            cmake-generator: Unix Makefiles

          # Linux i386 (cross-compiled)
          # Note: Uses ubuntu-22.04 for multiarch support (i386 packages may be limited on newer versions)
          - runner: ubuntu-22.04
            os: Ubuntu
            arch: i386
            build_type: cross
            cmake-generator: Unix Makefiles
            cross_compiler: gcc-i686-linux-gnu
            cross_prefix: i686-linux-gnu
            qemu_arch: i386

          # Linux armhf (cross-compiled)
          # Note: Uses ubuntu-22.04 because Ubuntu 24.04 dropped armhf repository support
          - runner: ubuntu-22.04
            os: Ubuntu
            arch: armhf
            build_type: cross
            cmake-generator: Unix Makefiles
            cross_compiler: gcc-arm-linux-gnueabihf
            cross_prefix: arm-linux-gnueabihf
            qemu_arch: arm

          # Windows AMD64
          - runner: windows-latest
            os: Windows
            arch: AMD64
            cmake-generator: Ninja

          # Windows ARM64
          - runner: windows-arm64
            os: Windows
            arch: ARM64
            cmake-generator: Ninja

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

          # Install cross-compilation toolchains for tier 2 architectures
          if [[ "${{ matrix.build_type }}" == "cross" ]]; then
            echo "Installing cross-compilation toolchain for ${{ matrix.arch }}..."

            # Enable multiarch support for target architecture
            if [[ "${{ matrix.arch }}" == "i386" ]]; then
              sudo dpkg --add-architecture i386
            elif [[ "${{ matrix.arch }}" == "armhf" ]]; then
              sudo dpkg --add-architecture armhf
            fi

            # Update package lists for multiarch
            sudo apt-get update

            # Install cross-compiler and QEMU
            sudo apt-get install -y \
              ${{ matrix.cross_compiler }} \
              qemu-user-binfmt

            # Install runtime libraries for target architecture
            if [[ "${{ matrix.arch }}" == "i386" ]]; then
              sudo apt-get install -y libc6:i386 libgcc1:i386
            elif [[ "${{ matrix.arch }}" == "armhf" ]]; then
              sudo apt-get install -y libc6:armhf libgcc1:armhf
            fi

            # Verify QEMU is registered
            echo "QEMU setup verification:"
            which qemu-${{ matrix.qemu_arch }} || echo "Warning: qemu-${{ matrix.qemu_arch }} not in PATH"
            cat /proc/sys/fs/binfmt_misc/qemu-${{ matrix.qemu_arch }} 2>/dev/null || echo "binfmt_misc not registered"
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja cmake -y
          # MSVC is pre-installed on windows-latest runner

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        working-directory: build
        run: |
          if [[ "${{ matrix.build_type }}" == "cross" ]]; then
            # Cross-compilation mode
            cmake -G "${{ matrix.cmake-generator }}" \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
              -DCMAKE_C_COMPILER=${{ matrix.cross_prefix }}-gcc \
              -DCMAKE_ASM_COMPILER=${{ matrix.cross_prefix }}-gcc \
              ..
          else
            # Native compilation mode
            cmake -G "${{ matrix.cmake-generator }}" ..
          fi

      - name: Build
        working-directory: build
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake --build . --config Release --parallel 4
          else
            make -j$(nproc || sysctl -n hw.ncpu)
          fi
        shell: bash

      - name: Verify cross-compilation (Linux cross-arch only)
        if: matrix.build_type == 'cross'
        working-directory: build
        run: |
          echo "=== Cross-compilation verification for ${{ matrix.arch }} ==="

          # Check binary exists
          ls -lh bin/test_fcontext_basic

          # Check binary architecture
          file bin/test_fcontext_basic

          # Verify ELF headers
          if [[ "${{ matrix.arch }}" == "i386" ]]; then
            readelf -h bin/test_fcontext_basic | grep "Class.*ELF32" || { echo "ERROR: Not 32-bit binary"; exit 1; }
            readelf -h bin/test_fcontext_basic | grep "Machine.*Intel 80386" || { echo "ERROR: Not i386 binary"; exit 1; }
          elif [[ "${{ matrix.arch }}" == "armhf" ]]; then
            readelf -h bin/test_fcontext_basic | grep "Class.*ELF32" || { echo "ERROR: Not 32-bit binary"; exit 1; }
            readelf -h bin/test_fcontext_basic | grep "Machine.*ARM" || { echo "ERROR: Not ARM binary"; exit 1; }
          fi

          echo "✓ Binary architecture verified"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Display test results
        if: always()
        working-directory: build
        run: |
          echo "=== Build Summary ==="
          echo "OS: ${{ matrix.os }} ${{ matrix.arch }}"
          echo "CMake Generator: ${{ matrix.cmake-generator }}"
          if [ -f Testing/Temporary/LastTest.log ]; then
            echo "=== Test Log ==="
            cat Testing/Temporary/LastTest.log
          fi
