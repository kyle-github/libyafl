name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test-unix:
    name: ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu AMD64
          - runner: ubuntu-latest
            os: Ubuntu
            arch: AMD64

          # Ubuntu ARM64
          - runner: ubuntu-24.04-arm
            os: Ubuntu
            arch: ARM64

          # macOS AMD64 (Intel)
          - runner: macos-15-intel
            os: macOS
            arch: AMD64

          # macOS ARM64 (Apple Silicon)
          - runner: macos-15
            os: macOS
            arch: ARM64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Create clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Configure CMake
        working-directory: build
        run: cmake -G "Unix Makefiles" ..

      - name: Build
        working-directory: build
        run: make -j$(nproc || sysctl -n hw.ncpu)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Display test results
        if: always()
        working-directory: build
        run: |
          echo "=== Build Summary ==="
          echo "OS: ${{ matrix.os }} ${{ matrix.arch }}"
          if [ -f Testing/Temporary/LastTest.log ]; then
            echo "=== Test Log ==="
            cat Testing/Temporary/LastTest.log
          fi

  build-and-test-windows:
    name: ${{ matrix.os }} - ${{ matrix.arch }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows AMD64 with MSVC
          - runner: windows-latest
            os: Windows
            arch: AMD64
            compiler: MSVC

          # Windows ARM64 with MSVC
          - runner: windows-11-arm
            os: Windows
            arch: ARM64
            compiler: MSVC

          # Windows AMD64 with MinGW
          - runner: windows-latest
            os: Windows
            arch: AMD64
            compiler: MinGW

          # Windows ARM64 with MinGW
          - runner: windows-11-arm
            os: Windows
            arch: ARM64
            compiler: MinGW

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install ninja -y
          # CMake is pre-installed on Windows runners

      - name: Setup MSVC environment
        if: matrix.compiler == 'MSVC'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Setup MinGW environment
        if: matrix.compiler == 'MinGW'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'ARM64' && 'CLANGARM64' || 'MINGW64' }}
          update: true
          install: >-
            ${{ matrix.arch == 'ARM64' && 'mingw-w64-clang-aarch64-toolchain' || 'mingw-w64-x86_64-toolchain' }}
            ${{ matrix.arch == 'ARM64' && 'mingw-w64-clang-aarch64-cmake' || 'mingw-w64-x86_64-cmake' }}

      - name: Create clean build directory
        run: |
          Remove-Item -Path build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path build -Force | Out-Null

      - name: Configure CMake (MSVC)
        if: matrix.compiler == 'MSVC'
        working-directory: build
        run: cmake -G "Ninja" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ..

      - name: Configure CMake (MinGW)
        if: matrix.compiler == 'MinGW'
        working-directory: build
        shell: msys2 {0}
        run: |
          if [ "${{ matrix.arch }}" = "ARM64" ]; then
            cmake -G "Ninja" -DCMAKE_C_COMPILER=clang -DCMAKE_ASM_COMPILER=clang ..
          else
            cmake -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_ASM_COMPILER=gcc ..
          fi

      - name: Build (MSVC)
        if: matrix.compiler == 'MSVC'
        working-directory: build
        run: cmake --build . --config Release --parallel 4

      - name: Build (MinGW)
        if: matrix.compiler == 'MinGW'
        working-directory: build
        shell: msys2 {0}
        run: cmake --build . --parallel 4

      - name: Run tests (MSVC)
        if: matrix.compiler == 'MSVC'
        working-directory: build
        run: ctest --output-on-failure

      - name: Run tests (MinGW)
        if: matrix.compiler == 'MinGW'
        working-directory: build
        shell: msys2 {0}
        run: ctest --output-on-failure

      - name: Display test results
        if: always()
        working-directory: build
        run: |
          echo "=== Build Summary ==="
          echo "OS: ${{ matrix.os }} ${{ matrix.arch }}"
          if (Test-Path Testing/Temporary/LastTest.log) {
            echo "=== Test Log ==="
            Get-Content Testing/Temporary/LastTest.log
          }

  # Cross-compilation for i386 (32-bit x86)
  cross-compile-i386:
    name: Ubuntu - i386 (cross-compiled)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update

          # Add i386 architecture
          sudo dpkg --add-architecture i386

          # Update package lists
          sudo apt-get update

          # Install cross-compiler, QEMU, and runtime libraries
          sudo apt-get install -y \
            cmake \
            build-essential \
            gcc-i686-linux-gnu \
            qemu-user-binfmt \
            libc6-dev:i386 \
            libgcc-s1:i386

      - name: Create clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Configure CMake for i386
        working-directory: build
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=i386 \
            -DCMAKE_C_COMPILER=i686-linux-gnu-gcc \
            -DCMAKE_ASM_COMPILER=i686-linux-gnu-gcc \
            ..

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      - name: Verify binary architecture
        working-directory: build
        run: |
          echo "=== Binary verification ==="
          ls -lh bin/test_fcontext_basic
          file bin/test_fcontext_basic
          readelf -h bin/test_fcontext_basic | grep "Class.*ELF32" || { echo "ERROR: Not 32-bit binary"; exit 1; }
          readelf -h bin/test_fcontext_basic | grep "Machine.*Intel 80386" || { echo "ERROR: Not i386 binary"; exit 1; }
          echo "✓ Binary architecture verified"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  # Cross-compilation for armhf (32-bit ARM hard-float)
  cross-compile-armhf:
    name: Ubuntu - armhf (cross-compiled)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update

          # Add armhf architecture
          sudo dpkg --add-architecture armhf

          # Ubuntu 24.04 uses DEB822 format - restrict main repos to amd64/i386
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
          fi

          # Add ARM ports repository
          cat << EOF | sudo tee /etc/apt/sources.list.d/arm-ports.list
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ noble-backports main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ noble-security main restricted universe multiverse
          EOF

          # Update package lists
          sudo apt-get update

          # Install cross-compiler, QEMU, and runtime libraries
          sudo apt-get install -y \
            cmake \
            build-essential \
            gcc-arm-linux-gnueabihf \
            qemu-user-binfmt \
            libc6-dev:armhf \
            libgcc-s1:armhf

      - name: Create clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Configure CMake for armhf
        working-directory: build
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armhf \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_ASM_COMPILER=arm-linux-gnueabihf-gcc \
            ..

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      - name: Verify binary architecture
        working-directory: build
        run: |
          echo "=== Binary verification ==="
          ls -lh bin/test_fcontext_basic
          file bin/test_fcontext_basic
          readelf -h bin/test_fcontext_basic | grep "Class.*ELF32" || { echo "ERROR: Not 32-bit binary"; exit 1; }
          readelf -h bin/test_fcontext_basic | grep "Machine.*ARM" || { echo "ERROR: Not ARM binary"; exit 1; }
          echo "✓ Binary architecture verified"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  # Cross-compilation for riscv64 (64-bit RISC-V)
  cross-compile-riscv64:
    name: Ubuntu - riscv64 (cross-compiled)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update

          # Add riscv64 architecture
          sudo dpkg --add-architecture riscv64

          # Ubuntu 24.04 uses DEB822 format - restrict main repos to amd64/i386
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
          fi

          # Add riscv64 ports repository
          cat << EOF | sudo tee /etc/apt/sources.list.d/riscv64-ports.list
          deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse
          deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main restricted universe multiverse
          deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports/ noble-backports main restricted universe multiverse
          deb [arch=riscv64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main restricted universe multiverse
          EOF

          # Update package lists
          sudo apt-get update

          # Install cross-compiler, QEMU, and runtime libraries
          sudo apt-get install -y \
            cmake \
            build-essential \
            gcc-riscv64-linux-gnu \
            qemu-user-binfmt \
            libc6-dev:riscv64 \
            libgcc-s1:riscv64

      - name: Create clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Configure CMake for riscv64
        working-directory: build
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=riscv64 \
            -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc \
            -DCMAKE_ASM_COMPILER=riscv64-linux-gnu-gcc \
            ..

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      - name: Verify binary architecture
        working-directory: build
        run: |
          echo "=== Binary verification ==="
          ls -lh bin/test_fcontext_basic
          file bin/test_fcontext_basic
          readelf -h bin/test_fcontext_basic | grep "Class.*ELF64" || { echo "ERROR: Not 64-bit binary"; exit 1; }
          readelf -h bin/test_fcontext_basic | grep "Machine.*RISC-V" || { echo "ERROR: Not RISC-V binary"; exit 1; }
          echo "✓ Binary architecture verified"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  # Cross-compilation for s390x (IBM System/390 64-bit)
  # Cross-compilation in Debian container for additional architectures
  cross-compile-debian:
    name: Debian - ${{ matrix.arch }} (container cross-compile)
    runs-on: ubuntu-24.04
    container: debian:bookworm

    strategy:
      fail-fast: false
      matrix:
        include:
          # MIPS 32-bit little-endian (O32 ABI)
          - arch: mipsel
            compiler_pkg: gcc-mipsel-linux-gnu
            qemu_pkg: qemu-user-binfmt
            processor: mips
            elf_class: ELF32
            elf_machine: MIPS

          # MIPS 64-bit little-endian (N64 ABI)
          - arch: mips64el
            compiler_pkg: gcc-mips64el-linux-gnuabi64
            qemu_pkg: qemu-user-binfmt
            processor: mips64
            elf_class: ELF64
            elf_machine: MIPS

          # PowerPC 64-bit little-endian
          - arch: ppc64el
            compiler_pkg: gcc-powerpc64le-linux-gnu
            qemu_pkg: qemu-user-binfmt
            processor: powerpc64
            elf_class: ELF64
            elf_machine: PowerPC

          # IBM System z (s390x)
          - arch: s390x
            compiler_pkg: gcc-s390x-linux-gnu
            qemu_pkg: qemu-user-binfmt
            processor: s390x
            elf_class: ELF64
            elf_machine: S/390

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            git \
            file

      - name: Install cross-compilation toolchain for ${{ matrix.arch }}
        run: |
          apt-get update

          # Install cross-compiler and QEMU
          # Note: The cross-compiler includes its own libc and libgcc libraries
          apt-get install -y \
            ${{ matrix.compiler_pkg }} \
            ${{ matrix.qemu_pkg }}

      - name: Create clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Configure CMake for ${{ matrix.arch }}
        working-directory: build
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -DCMAKE_C_COMPILER=${{ matrix.arch }}-linux-gnu-gcc \
            -DCMAKE_ASM_COMPILER=${{ matrix.arch }}-linux-gnu-gcc \
            ..

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      - name: Verify binary architecture
        working-directory: build
        run: |
          echo "=== Binary verification ==="
          ls -lh bin/test_fcontext_basic
          file bin/test_fcontext_basic
          readelf -h bin/test_fcontext_basic | grep "Class.*${{ matrix.elf_class }}" || { echo "ERROR: Binary class mismatch"; exit 1; }
          readelf -h bin/test_fcontext_basic | grep "Machine.*${{ matrix.elf_machine }}" || { echo "ERROR: Machine type mismatch"; exit 1; }
          echo "✓ Binary architecture verified"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure
