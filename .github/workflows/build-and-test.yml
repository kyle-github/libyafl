            libgcc-s1:s390x

      - name: Create clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Configure CMake for s390x
        working-directory: build
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=s390x \
            -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
            -DCMAKE_ASM_COMPILER=s390x-linux-gnu-gcc \
            ..

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      - name: Verify binary architecture
        working-directory: build
        run: |
          echo "=== Binary verification ==="
          ls -lh bin/test_fcontext_basic
          file bin/test_fcontext_basic
          readelf -h bin/test_fcontext_basic | grep "Class.*ELF64" || { echo "ERROR: Not 64-bit binary"; exit 1; }
          readelf -h bin/test_fcontext_basic | grep "Machine.*S/390" || { echo "ERROR: Not s390x binary"; exit 1; }
          echo "✓ Binary architecture verified"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  # Cross-compilation for sparc64 (SPARC 64-bit)
  cross-compile-sparc64:
    name: Ubuntu - sparc64 (cross-compiled)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update

          # Add sparc64 architecture
          sudo dpkg --add-architecture sparc64

          # Ubuntu 24.04 uses DEB822 format - restrict main repos to amd64/i386
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
          fi

          # Add sparc64 ports repository
          cat << EOF | sudo tee /etc/apt/sources.list.d/sparc64-ports.list
          deb [arch=sparc64] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse
          deb [arch=sparc64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main restricted universe multiverse
          deb [arch=sparc64] http://ports.ubuntu.com/ubuntu-ports/ noble-backports main restricted universe multiverse
          deb [arch=sparc64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main restricted universe multiverse
          EOF

          # Update package lists
          sudo apt-get update

          # Install cross-compiler, QEMU, and runtime libraries
          sudo apt-get install -y \
            cmake \
            build-essential \
            gcc-sparc64-linux-gnu \
            qemu-user-binfmt \
            libc6-dev:sparc64 \
            libgcc-s1:sparc64

      - name: Create clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Configure CMake for sparc64
        working-directory: build
        run: |
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=sparc64 \
            -DCMAKE_C_COMPILER=sparc64-linux-gnu-gcc \
            -DCMAKE_ASM_COMPILER=sparc64-linux-gnu-gcc \
            ..

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      - name: Verify binary architecture
        working-directory: build
        run: |
          echo "=== Binary verification ==="
          ls -lh bin/test_fcontext_basic
          file bin/test_fcontext_basic
          readelf -h bin/test_fcontext_basic | grep "Class.*ELF64" || { echo "ERROR: Not 64-bit binary"; exit 1; }
          readelf -h bin/test_fcontext_basic | grep "Machine.*Sparc" || { echo "ERROR: Not SPARC binary"; exit 1; }
          echo "✓ Binary architecture verified"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure
