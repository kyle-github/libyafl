name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: read

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    # Only run if the CI workflow succeeded AND it ran on the release branch
    if: ${{ github.event.workflow_run.head_branch == 'release' &&
      github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Log trigger information
        run: |
          echo "Triggered by workflow: ${{ github.event.workflow_run.name }}"
          echo "Workflow status: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Read VERSION
        id: get_version
        run: |
          VERSION=$(cat VERSION)
          echo "Creating release for version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get Release Details
        id: release_details
        uses: actions/github-script@v7
        with:
          script: |
            const commit_sha = "${{ github.event.workflow_run.head_sha }}";
            const { owner, repo } = context.repo;

            // Try to find a PR associated with this commit
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha,
            });

            let title = "";
            let body = "";

            if (prs.data.length > 0) {
              const pr = prs.data[0];
              title = pr.title;
              body = pr.body || "";
              console.log(`Found PR #${pr.number}: ${title}`);
            } else {
              // Fallback to commit message if no PR found
              const commit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: commit_sha,
              });
              title = commit.data.commit.message.split('\n')[0];
              body = commit.data.commit.message;
              console.log(`No PR found. Using commit message: ${title}`);
            }

            core.setOutput('title', title);
            core.setOutput('body', body);

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## ${{ steps.release_details.outputs.title }}

            ${{ steps.release_details.outputs.body }}

            ### Build Artifacts
            You can find the compilation artifact downloads for all required platforms in the respective CI action execution artifacts.
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: false
          draft: false
          prerelease: false
