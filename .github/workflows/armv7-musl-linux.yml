name: armv7-musl-linux

on: [push, pull_request]

jobs:
  setup-armv7-musl-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake make

  build-armv7-musl-linux:
    runs-on: ubuntu-latest
    needs: setup-armv7-musl-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake make
      - name: Download musl.cc cross-compiler
        run: |
          mkdir -p /opt/cross
          cd /opt/cross
          wget -q https://musl.cc/arm-linux-musleabihf-cross.tgz
          tar xzf arm-linux-musleabihf-cross.tgz
          rm arm-linux-musleabihf-cross.tgz
      - name: Configure and Build
        run: |
          mkdir -p build && cd build
          cmake -DTARGET=arm-unknown-linux-gnueabihf \
                -DCMAKE_C_COMPILER=/opt/cross/arm-linux-musleabihf-cross/bin/arm-linux-musleabihf-gcc \
                -DCMAKE_C_FLAGS='-static' \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=arm \
                ..
          cmake --build .
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-armv7-musl-linux
          path: build/

  test-armv7-musl-linux:
    runs-on: ubuntu-latest
    needs: build-armv7-musl-linux
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-armv7-musl-linux
          path: build/
      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure
