name: aarch64-apple-ios

on: [push, pull_request]

jobs:
    build-and-test:
        name: iOS Simulator (ARM64)
        runs-on: macos-15

        steps:
            - uses: actions/checkout@v4

            - name: Configure CMake
              run: |
                  cmake -G Xcode \
                    -DCMAKE_SYSTEM_NAME=iOS \
                    -DTARGET=aarch64-apple-ios \
                    -DCMAKE_OSX_ARCHITECTURES=arm64 \
                    -B build

            - name: Build
              run: cmake --build build --config Debug

            - name: Run Tests
              run: |
                  # Run tests using xcodebuild with iOS Simulator destination
                  xcodebuild test -project build/fcontext.xcodeproj -scheme test_fcontext_basic -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
                  xcodebuild test -project build/fcontext.xcodeproj -scheme test_fcontext_simple -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
                  xcodebuild test -project build/fcontext.xcodeproj -scheme test_fcontext_transfer -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
                  xcodebuild test -project build/fcontext.xcodeproj -scheme test_fcontext_alignment -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
                  xcodebuild test -project build/fcontext.xcodeproj -scheme test_fcontext_guard -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
                  xcodebuild test -project build/fcontext.xcodeproj -scheme test_fcontext_watermark_mmap -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
                  xcodebuild test -project build/fcontext.xcodeproj -scheme test_fcontext_watermark_malloc -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
                  xcodebuild test -project build/fcontext.xcodeproj -scheme test_fcontext_low_level -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
