name: aarch64-apple-ios

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        name: iOS Simulator (ARM64)
        runs-on: macos-15

        steps:
            - uses: actions/checkout@v4

            - name: Configure CMake
              run: |
                  cmake -G Xcode \
                    -DCMAKE_SYSTEM_NAME=iOS \
                    -DTARGET=aarch64-apple-ios \
                    -DCMAKE_OSX_ARCHITECTURES=arm64 \
                    -B build

            - name: Build
              run: cmake --build build --config Debug

            - name: Run Tests
              run: |
                  # Find and boot a suitable simulator (iPhone 15 or newer)
                  DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15" | head -n 1 | grep -E -o "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")

                  if [ -z "$DEVICE_ID" ]; then
                    echo "No iPhone 15 simulator found, trying generic iPhone"
                    DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | grep -E -o "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
                  fi

                  echo "Booting simulator: $DEVICE_ID"
                  xcrun simctl boot $DEVICE_ID

                  # Run tests via ctest
                  cd build
                  ctest -C Debug --output-on-failure
