name: s390x-musl-linux

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake make
      - name: Download musl.cc cross-compiler
        run: |
          mkdir -p /opt/cross
          cd /opt/cross
          wget -q https://musl.cc/s390x-linux-musl-cross.tgz
          tar xzf s390x-linux-musl-cross.tgz
          rm s390x-linux-musl-cross.tgz
      - name: Build
        run: |
          mkdir -p build && cd build
          cmake -DTARGET=s390x-ibm-linux-gnu \
                -DCMAKE_C_COMPILER=/opt/cross/s390x-linux-musl-cross/bin/s390x-linux-musl-gcc \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=s390x \
                ..
          cmake --build .
      - name: Test
        run: |
          cd build
          ctest --output-on-failure
