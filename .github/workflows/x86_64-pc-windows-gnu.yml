name: x86_64-pc-windows-gnu

on: [push, pull_request]

jobs:
  setup-x86_64-pc-windows-gnu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake

  build-x86_64-pc-windows-gnu:
    runs-on: windows-latest
    needs: setup-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
      - name: Configure
        shell: msys2 {0}
        run: |
          mkdir build; cd build
          cmake -G "Ninja" -DTARGET=x86_64-pc-windows-gnu -DCMAKE_C_COMPILER=gcc -DCMAKE_ASM_COMPILER=gcc ..
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 4
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-x86_64-pc-windows-gnu
          path: build/

  test-x86_64-pc-windows-gnu:
    runs-on: windows-latest
    needs: build-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-x86_64-pc-windows-gnu
          path: build/
      - name: Run Tests
        shell: msys2 {0}
        run: cd build && ctest --output-on-failure
