    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: "cmake -G Xcode \\\n  -DCMAKE_SYSTEM_NAME=iOS \\\n  -DTARGET=aarch64-apple-ios\
